<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariyum's Gallery - ماشاءاللہ</title>
    <!-- Google Fonts for Urdu -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --accent-color: #2ed573;
            --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2f3542;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Noto Nastaliq Urdu', serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            color: rgba(52, 152, 219, 0.4);
            animation: floatUp 6s linear infinite;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        header {
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 2.8rem;
            color: #2980b9;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.2rem;
            color: #57606f;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(52, 152, 219, 0.25);
        }

        .card-img-wrapper {
            width: 100%;
            height: 280px;
            overflow: hidden;
            position: relative;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-img-wrapper img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* This prevents cropping */
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            margin-top: auto; /* Pushes content to the bottom of the card */
        }

        .card-content h3 {
            font-size: 1.1rem;
            color: #2f3542;
            margin-bottom: 5px;
            font-family: 'Noto Nastaliq Urdu', serif;
        }

        /* Lightbox Modal */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            position: relative;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }

        .lightbox-content img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            z-index: 1010;
            background: rgba(0,0,0,0.4);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: rgba(41,128,185,0.8);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.7);
            color: #57606f;
            font-size: 1rem;
            position: relative;
            z-index: 2;
            border-top: 1px solid rgba(255,255,255,0.5);
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2.2rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
            .card-img-wrapper {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Sparkles Background -->
    <div class="sparkles" id="sparkles"></div>

    <header>
        <h1>ماشاءاللہ! مریم کی خوبصورت یادیں</h1>
        <p>Mariyum's Special Photo Gallery</p>
    </header>

    <div class="container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="close-btn" id="closeBtn">&times;</div>
        <div class="lightbox-content">
            <img id="lightboxImg" src="" alt="Mariyum">
        </div>
    </div>

    <footer>
        <p>صحت اور خوشیوں بھری زندگی کے لیے ڈھیر ساری دعائیں ❤️</p>
    </footer>

    <script>
        // Mariyum's exact filenames and titles
        const images = [
            { src: "B612_20180811_074702_570.jpg", title: "تائیکوانڈو یونیفارم میں مریم" },
            { src: "B612_20180811_074708_611.jpg", title: "بہترین انداز اور مسکراہٹ" },
            { src: "B612_20180811_074713_688.jpg", title: "شاندار پوز" },
            { src: "B612_20180811_074718_908.jpg", title: "پیاری سی تصویر" },
            { src: "B612_20190312_080155_491.jpg", title: "گلابی لباس میں پری جیسی مریم" },
            { src: "B612_20190312_084109_691.jpg", title: "پیارا سا مسکراتا چہرہ" },
            { src: "B612_20190606_111037_200.jpg", title: "رنگ برنگے ہار میں خوبصورت روپ" },
            { src: "B612_20191209_142059_060.jpg", title: "قدرتی ماحول میں یادگار لمحہ" },
            { src: "B612_20191209_142448_167.jpg", title: "پیاری یادیں" },
            { src: "B612_20191209_144003_643.jpg", title: "خوبصورت انداز" },
            { src: "B612_20191216_225549_288.jpg", title: "چوٹیوں والے پیارے بال" },
            { src: "Screenshot_20190303-195917_Photos.jpg", title: "روایتی لباس اور سجاوٹ" },
            { src: "20200801_094908.jpg", title: "پیلا لباس اور پیاری مسکراہٹ" },
            { src: "20210322_082740.jpg", title: "سفید لباس میں پھول جیسا انداز" }
        ];

        const galleryGrid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('closeBtn');

        // Populate Gallery
        images.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${item.src}" alt="Mariyum" loading="lazy">
                </div>
                <div class="card-content">
                    <h3>${item.title}</h3>
                </div>
            `;

            card.addEventListener('click', () => {
                lightboxImg.src = item.src;
                lightbox.classList.add('active');
            });

            galleryGrid.appendChild(card);
        });

        // Close Lightbox
        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });

        // Create Floating Sparkles
        const sparklesContainer = document.getElementById('sparkles');
        const sparkleSymbols = ['❤️', '✨', '💖', '⭐', '🌸'];

        for (let i = 0; i < 20; i++) {
            const span = document.createElement('span');
            span.className = 'sparkle';
            span.innerHTML = sparkleSymbols[Math.floor(Math.random() * sparkleSymbols.length)];
            span.style.left = Math.random() * 100 + '%';
            span.style.top = Math.random() * 100 + '%';
            span.style.animationDuration = (4 + Math.random() * 4) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            sparklesContainer.appendChild(span);
        }
    </script>
</body>
</html>
